name: Deploy to GitHub Pages

# Pages serves a project site from https://<owner>.github.io/<repo>/, so every
# asset URL has to carry /<repo>/. vite.config.ts derives that from
# GITHUB_REPOSITORY rather than hard-coding it, which means this workflow keeps
# working if the repository is renamed.

# Tags, not every push to main.
#
# Testers install this as a PWA and keep it. Deploying every commit meant every
# half-finished change on main became the build somebody was reading from, and
# a bug report could not be pinned to anything. A tag is a deliberate act: main
# stays free for daily work, and what testers get is the last thing deliberately
# released.
#
#   git tag -a v0.4.0 -m "…"  &&  git push origin v0.4.0
#
# The tag name also becomes the version shown in Settings — see resolveVersion
# in vite.config.ts — so "which build?" has an answer a tester can read off.
on:
  push:
    tags: ['v*']
  # Redeploy the current tag without cutting a new one, and the way to publish
  # a build from a branch while testing the workflow itself.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` because cancelling a
# half-finished deploy is how a site ends up serving a partial build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A .gitignore pattern that names a top-level directory without a leading
      # slash matches at every level, so `qul/` silently excluded `src/qul/`
      # too. That surfaced as sixteen TS2307/TS7006 errors that looked like a
      # code problem rather than a missing directory. This says what actually
      # happened, before the compiler gets a chance to be cryptic about it.
      - name: Check the source tree arrived intact
        run: |
          missing=0
          for dir in app catalog components dictionary ingest lib library \
                     platform qul quran retrieval shamela translation ui; do
            if [ ! -d "src/$dir" ]; then
              echo "::error::src/$dir is missing from the repository."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Some source directories were not committed. Check .gitignore — a pattern like 'qul/' matches at every level and will exclude src/qul/ as well. Anchor it as '/qul/'."
            exit 1
          fi
          echo "All source directories present."

      - run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this is the typecheck gate
      # as well as the build.
      #
      # `npm run verify` is deliberately NOT run here. It reads real Shamela
      # pages from fixtures/ and real QUL resources from qul/, and neither is in
      # this repository — they are book and third-party data, and this repo is
      # public. Verification stays a local gate, run before pushing, where those
      # files exist.
      - run: npm run build
        env:
          # A repository *variable*, not a secret — it is a public URL that ends
          # up in the built JavaScript either way, and marking it secret would
          # only mean Actions redacts it from the logs of the person trying to
          # work out why importing is switched off.
          #
          # Settings → Secrets and variables → Actions → Variables → PROXY_URL,
          # set to the deployed Worker's origin with no trailing path, e.g.
          # https://hashiya-proxy.<subdomain>.workers.dev
          #
          # Unset is a supported state: the app builds and runs, and says
          # importing is unavailable in this deployment.
          PROXY_URL: ${{ vars.PROXY_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
